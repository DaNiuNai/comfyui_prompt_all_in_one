[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui_prompt_all_in_one"
version = "0.0.1"
description = "A bilingual prompt editor, library, history, translation, and AI assistant for ComfyUI"
authors = [
  {name = "DaNiuNai", email = "you@gmail.com"}
]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "openai>=1.0",
    "boto3>=1.34",
    "translators>=5.9",
]



[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
    "types-PyYAML",
    "types-requests",
]

[project.urls]
Repository = "https://github.com/DaNiuNai/comfyui_prompt_all_in_one"
BugTracker = "https://github.com/DaNiuNai/comfyui_prompt_all_in_one/issues"
Documentation = "https://github.com/DaNiuNai/comfyui_prompt_all_in_one/wiki"


[tool.comfy]
PublisherId = "DaNiuNai"
DisplayName = "comfyui-prompt-all-in-one"
Icon = ""
Tags = ["prompt", "translation", "productivity"]
Repository = "https://github.com/DaNiuNai/comfyui_prompt_all_in_one"
includes = ["dist/"]

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.setuptools.packages.find]
include = ["prompt_all_in_one*"]
exclude = ["ui*", "tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = ["prompt_all_in_one", "tests"]
mypy_path = "typings"
explicit_package_bases = true

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[[tool.mypy.overrides]]
module = "prompt_all_in_one.legacy_translators.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "translators"
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["prompt_all_in_one/legacy_translators"]
line-length = 140
src = ["prompt_all_in_one", "tests"]
target-version = "py310"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
